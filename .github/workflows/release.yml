name: Release

# Push a tag like v0.3.0 to publish a GitHub release.  MELPA Stable builds
# from the same tag, so the tag must match the "Version:" header.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the Version header
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^;; Version: *//p' jenkins-browser.el)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match 'Version: $version' in jenkins-browser.el" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No section for $version in CHANGELOG.md" >&2
            exit 1
          fi
          cat notes.md

      - uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'

      - name: Check
        run: make check

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "${TAG#v}" --notes-file notes.md --verify-tag
