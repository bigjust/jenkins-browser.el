name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['27.1', '29.4', '30.1']
    steps:
      - uses: actions/checkout@v5

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Byte-compile (warnings are errors)
        run: |
          emacs -Q --batch -L . --eval '(setq byte-compile-error-on-warn t)' \
                -f batch-byte-compile jenkins-mode.el
          rm -f jenkins-mode.elc

      - name: Checkdoc
        run: |
          out=$(emacs -Q --batch --eval '(checkdoc-file "jenkins-mode.el")' 2>&1)
          echo "$out"
          test -z "$out"

      - name: Tests
        run: |
          emacs -Q --batch -L . -l test/jenkins-mode-test.el \
                -f ert-run-tests-batch-and-exit
