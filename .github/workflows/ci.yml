name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['27.1', '29.4', '30.1']
    steps:
      - uses: actions/checkout@v5

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Byte-compile (warnings are errors)
        run: make compile

      - name: Checkdoc
        run: make checkdoc

      - name: Package-lint
        run: make lint

      - name: Tests
        run: make test
